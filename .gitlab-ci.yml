# ==============================================================================
# Bonny Bakes - Windows Runner CI/CD Matrix
# Runs on local 24/7 Windows Runner (ID: 56201256)
# ==============================================================================

stages:
  - test
  - security
  - deploy

default:
  tags:
    - windows
    - powershell

variables:
  GIT_CLEAN_FLAGS: "none"

validate_assets:
  stage: test
  script:
    - if (-not (Test-Path "index.html")) { Write-Error "index.html missing"; exit 1 }
    - if (-not (Test-Path "script.js")) { Write-Error "script.js missing"; exit 1 }
    - if (-not (Test-Path "style.css")) { Write-Error "style.css missing"; exit 1 }
    - Write-Host "All Bonny Bakes core assets verified." -ForegroundColor Green

security_audit:
  stage: security
  script:
    - $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
    - Write-Host "==> Running Gitleaks Secret Detection..."
    - gitleaks detect --source "." --no-git --redact -v
  allow_failure: true

pages:
  stage: deploy
  dependencies:
    - validate_assets
  script:
    - if (Test-Path public) { Remove-Item -Path public -Recurse -Force }
    - New-Item -ItemType Directory -Path public -Force | Out-Null
    - Copy-Item -Path "*.*" -Destination "public\" -Force
    - if (Test-Path "images") { Copy-Item -Path "images" -Destination "public\images" -Recurse -Force }
    - if (Test-Path "assets") { Copy-Item -Path "assets" -Destination "public\assets" -Recurse -Force }
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
