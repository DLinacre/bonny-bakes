<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 30% 22%, #fff0f5, transparent 55%),
      linear-gradient(150deg, #ffe3ec, #ffd3e2);
    display: grid; place-items: center; border-radius: 112px;
  }
  .wrap { position: relative; }
  .heart { filter: drop-shadow(0 18px 30px rgba(140,13,61,.35)); }
  .stem {
    position: absolute; left: 52%; top: -34px; width: 120px; height: 90px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="stem" viewBox="0 0 120 90" fill="none">
      <path d="M10 84 C 18 40, 48 16, 96 10" stroke="#6f8f5f" stroke-width="14" stroke-linecap="round"/>
      <path d="M96 10 c 14 -2 22 4 26 12 c -12 6 -24 4 -30 -4 z" fill="#8aab77"/>
    </svg>
    <svg class="heart" width="330" height="300" viewBox="0 0 24 24">
      <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z" fill="#c2185b"/>
      <path d="M8.2 8.6c-1.4 1-2.2 2.4-2.3 3.9" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>
</body>
</html>
